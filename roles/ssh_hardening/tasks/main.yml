---
- name: Check if ssh.socket is active
  ansible.builtin.command: systemctl is-active ssh.socket
  register: ssh_socket_status
  changed_when: false
  failed_when: false

- name: Disable ssh.socket if active (Debian 13 socket activation)
  ansible.builtin.systemd:
    name: ssh.socket
    state: stopped
    enabled: false
  when: ssh_socket_status.stdout == "active"

- name: Ensure ssh.service is enabled and running
  ansible.builtin.systemd:
    name: ssh
    state: started
    enabled: true

- name: Ensure sshd_config.d exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Remove all drop-in configs from sshd_config.d
  ansible.builtin.find:
    paths: /etc/ssh/sshd_config.d
    file_type: file
  register: sshd_dropins

- name: Delete drop-in files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ sshd_dropins.files }}"

- name: Deploy hardened sshd_config
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: '0644'
    validate: '/usr/sbin/sshd -t -f %s'
  notify: Restart ssh

- name: Allow SSH port in nftables placeholder
  ansible.builtin.debug:
    msg: "SSH port {{ ssh_port }} will be opened by firewall role"
